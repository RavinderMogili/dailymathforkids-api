name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (handlers, scoring)
        run: npm test -- --testPathPatterns="api|scoring"

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    # These tests make real network calls against whatever LIVE_API_BASE_URL
    # points at, and integration.test.js creates real accounts there — see
    # tests/live/liveGuard.js. That guard unconditionally refuses to run
    # against the known production host, so this job now needs a staging/
    # preview deployment's URL configured as the LIVE_API_BASE_URL repo/
    # environment secret before it will do anything but fail closed with a
    # clear error. It previously ran directly against production
    # (dailymathforkids-api.vercel.app) on every push/PR to main, relying on
    # SUPABASE_SERVICE_ROLE for cleanup — that is exactly the behavior this
    # change removes. Point this at a non-production deployment, or decide
    # deliberately (and separately from this guard) to keep testing against
    # production and accept that tradeoff explicitly.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run live/integration tests (requires a staging LIVE_API_BASE_URL secret)
        env:
          ALLOW_LIVE_TESTS: "true"
          LIVE_API_BASE_URL: ${{ secrets.LIVE_API_BASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run test:live
